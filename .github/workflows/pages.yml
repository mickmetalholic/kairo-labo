name: Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write
  pages: write

jobs:
  build:
    name: Build Gallery
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      CI: true
      DO_NOT_TRACK: 1
      FORCE_COLOR: 1
      GITHUB_PAGES_BASE_PATH: /${{ github.event.repository.name }}/
      TURBO_TELEMETRY_DISABLED: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build Gallery
        run: pnpm --filter @kairo-labo/kairo-gallery build

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/kairo-gallery/dist

  deploy:
    name: Deploy Gallery
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5
